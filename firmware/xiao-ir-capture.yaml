# IR capture rig for the XIAO Smart IR Mate.
#
# You do not need this to use the AC: the protocol is already measured and the
# normal firmware is xiao-lg-lp0721wsr.yaml. This is for reverse-engineering, so
# reach for it only if your remote turns out to behave differently or you are
# adding a model.
#
# Flash it, open the ESPHome log stream, then work through the capture matrix in
# research/capture-guide.md. Every button press on the LG remote prints a
# "Received Raw:" block that research/tools/decode.py can parse.
#
# Keep `name` identical to your existing device so Home Assistant keeps the
# same device and entity IDs instead of re-adopting it as something new. Copy
# `api.encryption.key` and `ota.password` out of your current dashboard config
# into secrets.yaml first, otherwise the OTA update will be rejected and you
# will need to reflash over USB. See README.md for the secrets.yaml template.

substitutions:
  # This must stay byte-for-byte identical to the name the device already
  # answers to. Seeed's factory firmware uses "xiao-ir-mate"; confirm yours by
  # browsing for _esphomelib._tcp on your network and stripping the MAC suffix.
  name: "xiao-ir-mate"
  friendly_name: "XIAO Smart IR Mate"
  # Lives in secrets.yaml because it is derived from your device's MAC, so there
  # is no value here that would be right for anyone else.
  device_address: !secret device_address
  # The raw dumper logs at DEBUG. INFO (Seeed's default) hides every capture.
  log_level: "DEBUG"
  # This has to be "raw", not "all". ESPHome marks the raw dumper as *secondary*,
  # meaning it only runs when no protocol-specific dumper claimed the frame, and
  # the Pronto dumper claims everything. So "all" silently produces no
  # "Received Raw:" lines at all, which is exactly what parse_raw.py needs.
  ir_dump: "raw"

packages:
  hardware: !include packages/xiao-hardware.yaml

# Type the state you are about to capture here, press "Mark Capture", then
# press the button on the LG remote. The mark is written to the log in the
# exact "# state: ..." format that research/tools/parse_raw.py reads, so labels survive
# a copy-paste of the log with no manual editing.
text:
  - platform: template
    id: capture_label
    name: "Capture Label"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 100
    initial_value: "mode=cool temp=72 fan=high"

button:
  - platform: template
    id: mark_capture
    name: "Mark Capture"
    on_press:
      - script.execute:
          id: haptic
          duration: 60
      - logger.log: "--------------------------------------------------"
      - logger.log:
          level: INFO
          format: "# state: %s"
          args: ["id(capture_label).state.c_str()"]

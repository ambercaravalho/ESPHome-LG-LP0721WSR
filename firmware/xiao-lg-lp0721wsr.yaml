# LG LP0721WSR portable air conditioner, controlled over IR by a Seeed Studio
# XIAO Smart IR Mate.
#
# This is one worked example of using packages/lg-portable-ac.yaml. If you
# already have an IR blaster running ESPHome, you do not need this file at all:
# add that package to your existing config instead. See README.md.
#
# Before flashing:
#   1. Copy firmware/secrets.yaml.example to firmware/secrets.yaml and fill it
#      in. Take `api_encryption_key` and `ota_password` from the config your
#      device is already running, or the OTA update will be rejected.
#   2. Point `lg_ac_temperature_entity` at a temperature sensor you already have
#      in the room.

substitutions:
  # Must match the name the device already answers to, or Home Assistant treats
  # this as a brand-new device and orphans the existing entities.
  name: "xiao-ir-mate"
  friendly_name: "Portable AC"
  # Lives in secrets.yaml because it is derived from your device's MAC, so there
  # is no value here that would be right for anyone else.
  device_address: !secret device_address
  log_level: "DEBUG"
  # Keep the raw dumper on: it costs nothing and it is how you compare what we
  # transmit against what the real remote sends. Set to "none" once happy.
  ir_dump: "raw"

  # Consumed by packages/lg-portable-ac.yaml. The transmitter and receiver ids
  # match the ones xiao-hardware.yaml defines, so they are left at their
  # defaults. `None` makes the climate entity inherit ${friendly_name}, which is
  # what you want on a device dedicated to the AC.
  lg_ac_name: "None"
  # A plain sensor, so the reading is the entity's state and no `attribute:` is
  # needed. The thermostat's own climate.* entity would need one, since a climate
  # entity's state is its HVAC mode.
  lg_ac_temperature_entity: "sensor.living_room_thermostat_current_temp"

packages:
  hardware: !include packages/xiao-hardware.yaml
  lg_ac: !include packages/lg-portable-ac.yaml

external_components:
  # Local checkout, because this config lives in the repo. Configs outside it
  # should use the GitHub source shown in packages/lg-portable-ac.yaml.
  - source:
      type: local
      path: ../components
    components: [lg_portable_ac]

# The AC package is deliberately hardware-agnostic, so it does not know about
# this board's LED and vibration motor. `!extend` adds the acknowledgement to
# the entities it defined rather than redefining them.
button:
  - id: !extend lg_ac_light_button
    on_press:
      - script.execute: ack_transmit

number:
  - id: !extend lg_ac_timer
    set_action:
      - script.execute: ack_transmit

# The thermostat reports Fahrenheit, and the homeassistant sensor imports the
# raw number without converting, while the climate component works in Celsius.
# Without this, 78F arrives as 78C and Home Assistant renders it back as 172F.
sensor:
  - id: !extend lg_ac_room_temperature
    filters:
      - lambda: return (x - 32.0f) * 5.0f / 9.0f;

binary_sensor:
  # Tap the top of the IR Mate to toggle the AC without a phone.
  - platform: gpio
    id: touch_pad
    pin:
      number: GPIO5
      mode: INPUT_PULLDOWN
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: ack_transmit
      - if:
          condition:
            lambda: return id(ac).mode != climate::CLIMATE_MODE_OFF;
          then:
            - climate.control:
                id: ac
                mode: "OFF"
          else:
            - climate.control:
                id: ac
                mode: COOL

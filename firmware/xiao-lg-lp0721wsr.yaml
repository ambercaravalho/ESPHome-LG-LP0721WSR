# LG LP0721WSR portable air conditioner, controlled over IR by a Seeed Studio
# XIAO Smart IR Mate.
#
# Before flashing:
#   1. Copy firmware/secrets.yaml.example to firmware/secrets.yaml and fill it
#      in. Take `api_encryption_key` and `ota_password` from the config your
#      device is already running, or the OTA update will be rejected.
#   2. Point `room_temperature_entity` at a temperature sensor you already have
#      in the room, or delete the `sensor:` block below. The AC does not report
#      its own temperature, so this is the only way the climate card can show a
#      current temperature.
#   3. Nothing. The protocol is measured from this unit's own remote and the
#      component defaults to it, so the `climate:` block below needs no tuning.
#      PROTOCOL.md records the evidence if you want to check it.

substitutions:
  # Must match the name the device already answers to, or Home Assistant treats
  # this as a brand-new device and orphans the existing entities.
  name: "xiao-ir-mate"
  friendly_name: "Portable AC"
  # "${name}-" plus the last three bytes of the MAC, lowercase and unseparated.
  device_address: "xiao-ir-mate-1a2b3c.local"
  log_level: "DEBUG"
  # Keep the raw dumper on: it costs nothing and it is how you compare what we
  # transmit against what the real remote sends. Set to "none" once happy.
  ir_dump: "raw"
  room_temperature_entity: "sensor.living_room_temperature"

packages:
  hardware: !include packages/xiao-hardware.yaml
  extras: !include packages/lg-extras.yaml

external_components:
  # Local checkout. If you are pasting this into Home Assistant's ESPHome
  # dashboard rather than running it from a clone, swap this for:
  #
  #   - source: github://ambercaravalho/ESPHome-LG-LP0721WSR
  #     components: [lg_portable_ac]
  #
  - source:
      type: local
      path: ../components
    components: [lg_portable_ac]

sensor:
  - platform: homeassistant
    id: room_temperature
    entity_id: ${room_temperature_entity}
    internal: true

climate:
  - platform: lg_portable_ac
    id: ac
    # `None` makes the entity take the device's friendly name, so you get
    # climate.portable_ac rather than climate.portable_ac_portable_ac.
    name: None
    icon: mdi:air-conditioner
    transmitter_id: ir_tx
    # Wiring the receiver in is what keeps Home Assistant honest: press the
    # physical remote and the entity follows, instead of silently drifting.
    receiver_id: ir_rx
    sensor: room_temperature

    # Set false on units with a fixed vane, purely to hide the control.
    supports_swing: true

    # The timings are measured and are already the component's defaults, so this
    # block is here to be explicit rather than because it is required. Only touch
    # it if your own captures disagree; see PROTOCOL.md.
    header_high: 3150us
    header_low: 1590us
    bit_high: 550us
    bit_one_low: 1070us
    bit_zero_low: 290us

binary_sensor:
  # Tap the top of the IR Mate to toggle the AC without a phone.
  - platform: gpio
    id: touch_pad
    pin:
      number: GPIO5
      mode: INPUT_PULLDOWN
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: ack_transmit
      - if:
          condition:
            lambda: return id(ac).mode != climate::CLIMATE_MODE_OFF;
          then:
            - climate.control:
                id: ac
                mode: "OFF"
          else:
            - climate.control:
                id: ac
                mode: COOL

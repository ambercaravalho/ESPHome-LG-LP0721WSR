# Remote functions that do not fit a Home Assistant climate entity.
#
# The climate entity covers power, mode, setpoint, fan speed and swing. Two
# buttons on the remote are left over, and they are quite different from each
# other:
#
#   Light  is a press, not a state. The unit cycles On -> Dim -> Off internally
#          and the protocol never reports which one it is on, so this can only
#          ever be a button.
#   Timer  is a state, and an absolute one. Byte 9 states the whole value, so
#          twelve hours is a single transmission rather than twelve presses.
#
# Expected substitutions: none. Requires a `lg_portable_ac` climate component
# with id `ac`, and the `ack_transmit` script from xiao-hardware.yaml.

button:
  - platform: template
    id: light_cycle_button
    name: "Display Brightness"
    icon: mdi:brightness-6
    entity_category: config
    on_press:
      - lg_portable_ac.light_toggle: ac
      - script.execute: ack_transmit

number:
  # Zero disarms. Unlike the physical remote there is no walking the counter
  # round past 24 to cancel, and no need to press briskly before the remote
  # drops out of timer-setting mode.
  #
  # `lambda` rather than `optimistic: true` so the value follows the unit when
  # somebody uses the real remote: the component reads the timer out of every
  # frame it receives. Returning nothing when the value has not moved keeps the
  # poll from republishing an unchanged number every 15 seconds, which is harmless
  # in itself but buries the transmit and receive lines we read the log for.
  - platform: template
    id: delay_timer
    name: "Delay Timer"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "h"
    device_class: duration
    update_interval: 15s
    min_value: 0
    max_value: 24
    step: 1
    mode: box
    lambda: |-
      const float hours = id(ac).get_timer_hours();
      if (id(delay_timer).has_state() && id(delay_timer).state == hours)
        return {};
      return hours;
    set_action:
      - lg_portable_ac.set_timer:
          id: ac
          hours: !lambda return (uint8_t) x;
      - script.execute: ack_transmit

# Shared hardware definition for the Seeed Studio XIAO Smart IR Mate
# (XIAO ESP32-C3, 3x IR LED + 1x IR receiver).
#
# Included by both firmware/xiao-ir-capture.yaml and
# firmware/xiao-lg-lp0721wsr.yaml so the two configs cannot drift apart.
#
# Expected substitutions: name, friendly_name, device_address, log_level, ir_dump

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "ambercaravalho.lg-lp0721wsr"
    version: "1.0"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: ${log_level}

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
  # name_add_mac_suffix means the device answers to "${name}-<mac suffix>", which
  # the esphome CLI cannot work out by itself. Without this, OTA pushes are sent
  # to the suffix-less "${name}.local" and fail to resolve.
  use_address: ${device_address}
  on_connect:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 20%
    - delay: 2s
    - light.turn_off: status_led

captive_portal:

remote_transmitter:
  id: ir_tx
  pin: GPIO3
  # Seeed's reference config specifies 50%; the three emitters are driven hard
  # enough that a higher duty cycle risks browning out over USB power.
  carrier_duty_percent: 50%
  # The default since 2025.11.0, set explicitly to silence the warning about it.
  # This is also what lets the emitter be shared: a blocking transmit would stall
  # the loop for the ~70ms an LG frame takes.
  non_blocking: true

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO4
    inverted: true
  dump: ${ir_dump}
  # LG remotes have loose timings; the stock 25% rejects many real frames.
  tolerance: 55%
  # Measured on this remote: a 3180/1610us header, then a constant ~540us mark
  # with either a ~302us or a ~1090us space carrying the bit. Nothing mid-frame
  # comes close to the 8-10ms gaps other LG models are documented to have, so the
  # default 1MHz clock is fine and gives 1us rather than 2us resolution. Keep
  # idle above ~1.1ms by a wide margin but short enough that a repeated frame
  # arrives as two captures rather than one double-length one.
  idle: 15ms
  # Must stay well clear of the ~302us short space. The old 250us sat close
  # enough that jitter could swallow a real one, and a swallowed space does not
  # produce an obvious error: it silently merges two bits into one long mark.
  filter: 100us
  # A 112-bit frame is 224 symbols before the header and terminator, so the
  # default 192 truncates it. The C3's RX hardware only holds 96 symbols at a
  # time; the driver streams into this larger buffer as the hardware fills.
  receive_symbols: 512
  buffer_size: 20000b
  on_raw:
    # The symbol count is the fastest way to spot a truncated capture: every
    # press of a given button must report the same number.
    - lambda: |-
        ESP_LOGD("ir", "raw frame: %u symbols", (unsigned) x.size());
    - script.execute: ack_receive

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    # No entity in Home Assistant: the LED only exists to flash an acknowledgement
    # from the scripts below, and publishing it just fills the log with state changes.
    internal: true
    pin: GPIO7
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    rmt_symbols: 48
    default_transition_length: 0s

output:
  - platform: gpio
    id: vibration_output
    pin: GPIO6

switch:
  - platform: factory_reset
    id: factory_reset_switch
    name: "Factory Reset"
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    id: reset_button
    pin:
      number: GPIO9 # strapping pin
      mode: INPUT_PULLUP
    filters:
      - invert
    on_click:
      - min_length: 50ms
        max_length: 4s
        then:
          - script.execute:
              id: haptic
              duration: 100
          - logger.log: "Reset button: restarting"
          - delay: 200ms
          - button.press: restart_button
      - min_length: 5s
        max_length: 20s
        then:
          - script.execute:
              id: haptic
              duration: 500
          - logger.log: "Reset button: factory reset"
          - switch.turn_on: factory_reset_switch

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: diagnostic

script:
  # Buzz the vibration motor for `duration` milliseconds.
  - id: haptic
    mode: restart
    parameters:
      duration: int
    then:
      - output.turn_on: vibration_output
      - delay: !lambda return duration;
      - output.turn_off: vibration_output

  # Visual + haptic acknowledgement that something was transmitted.
  - id: ack_transmit
    mode: restart
    then:
      - script.execute:
          id: haptic
          duration: 60
      - light.turn_on:
          id: status_led
          red: 0%
          green: 30%
          blue: 100%
          brightness: 30%
      - delay: 150ms
      - light.turn_off: status_led

  # Purely visual acknowledgement that a frame was received, so you can tell a
  # missed remote press from a missed decode without reading the log.
  - id: ack_receive
    mode: restart
    then:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 60%
          blue: 0%
          brightness: 30%
      - delay: 150ms
      - light.turn_off: status_led
